services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payoutflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-payoutflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-payoutflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    command: sh -c "export PYTHONPATH=/app && python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120 --keep-alive 5"
    env_file: .env
    environment:
      PYTHONPATH: /app
      # Локальный Docker — development (без SSL redirect). Для прода — задайте production в .env или override.
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
      DATABASE_URL: postgres://${POSTGRES_USER:-payoutflow}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-payoutflow}
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: .
    command: sh -c "export PYTHONPATH=/app && python -m celery -A config worker -l info"
    env_file: .env
    environment:
      PYTHONPATH: /app
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
      DATABASE_URL: postgres://${POSTGRES_USER:-payoutflow}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-payoutflow}
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
